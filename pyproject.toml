[project]
name = "invoice-api"
version = "0.1.0"
description = "A FastAPI-based invoicing service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.124.0",
    "pyjwt>=2.10.1",
    "pydantic>=2.12.5",
    "google-cloud-firestore>=2.19.0",
    "uvicorn>=0.34.0",
    "dotenv>=0.9.9",
    "resend>=2.19.0",
    "pydantic-settings>=2.12.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.4",
    "mypy>=1.13.0",
]

[tool.uv]
package = true

[tool.setuptools]
packages = ["invoice_api"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "ANN",    # flake8-annotations (require type annotations)
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
]
ignore = [
    "B008",   # FastAPI uses function calls in defaults for Depends()
]

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = false
suppress-none-returning = false

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true
# Allow calling functions from untyped libraries
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = "google.cloud.*"
ignore_missing_imports = true
