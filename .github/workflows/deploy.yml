name: Build and Push to GCR

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: us-central1
  IMAGE_NAME: invoice-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker gcr.io

      - name: Build Docker image
        run: |
          docker build -t europe-west8-docker.pkg.dev/${{ env.PROJECT_ID }}/invoice-api/${{ env.IMAGE_NAME }}:latest \
                       -t europe-west8-docker.pkg.dev/${{ env.PROJECT_ID }}/invoice-api/${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Push Docker image to GCR
        run: |
          docker push europe-west8-docker.pkg.dev/${{ env.PROJECT_ID }}/invoice-api/${{ env.IMAGE_NAME }}:latest
          docker push europe-west8-docker.pkg.dev/${{ env.PROJECT_ID }}/invoice-api/${{ env.IMAGE_NAME }}:${{ github.sha }}
